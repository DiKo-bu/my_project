name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - run: pip install flet

      # Вставляем разрешения на интернет и открытие ссылок прямо в манифест
      - name: Patch Android Manifest
        run: |
          # Триггерим flet, чтобы он создал/скачал флаттер-шаблон
          flet build apk --no-interactive || true
          
          # Находим сгенерированный AndroidManifest.xml
          MANIFEST=$(find ~/.flet -name AndroidManifest.xml | grep main/AndroidManifest.xml | head -n 1)
          
          # Инжектим твои правила
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />' $MANIFEST
          sed -i '/<application/i \    <queries><intent><action android:name="android.intent.action.VIEW" /><data android:scheme="https" /></intent><intent><action android:name="android.intent.action.VIEW" /><data android:scheme="http" /></intent></queries>' $MANIFEST

      - run: flet build apk --no-interactive

      - uses: actions/upload-artifact@v4
        with:
          name: prognoz-apk
          path: build/apk/app-release.apk
