name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Устанавливаем именно ту версию Flutter, которую требует Flet, чтобы не было запросов
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'

      - name: Install Flet
        run: pip install flet

      # Находим шаблонный манифест внутри установленного пакета flet_cli и инжектим правила
      - name: Patch Android Manifest Template
        run: |
          MANIFESTS=$(find /opt/hostedtoolcache/Python/ -name AndroidManifest.xml 2>/dev/null || true)
          for MANIFEST in $MANIFESTS; do
            echo "Патчим шаблон: $MANIFEST"
            sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
            sed -i '/<application/i \    <queries><intent><action android:name="android.intent.action.VIEW" /><data android:scheme="https" /></intent><intent><action android:name="android.intent.action.VIEW" /><data android:scheme="http" /></intent></queries>' "$MANIFEST"
          done

      # Собираем APK (прокидываем "y" на всякий случай)
      - name: Build APK
        run: echo "y" | flet build apk --project .

      # Выгружаем готовый артефакт
      - uses: actions/upload-artifact@v4
        with:
          name: prognoz-apk
          path: build/apk/*.apk
