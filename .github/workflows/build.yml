name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Flet
        run: pip install flet

      # Вставляем разрешения на интернет и открытие ссылок прямо в манифест
      - name: Patch Android Manifest
        run: |
          # Триггерим flet (скачивание шаблонов), автоматически соглашаясь на всё через echo "y"
          echo "y" | flet build apk || true
          
          # Ищем AndroidManifest.xml везде: и в кэше пользователя, и внутри установленного пакета python
          MANIFESTS=$(find /home/runner /opt/hostedtoolcache/Python/ -name AndroidManifest.xml 2>/dev/null || true)
          
          # Проходимся по всем найденным манифестам и жестко инжектим твои правила
          for MANIFEST in $MANIFESTS; do
            echo "Патчим манифест: $MANIFEST"
            sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
            sed -i '/<application/i \    <queries><intent><action android:name="android.intent.action.VIEW" /><data android:scheme="https" /></intent><intent><action android:name="android.intent.action.VIEW" /><data android:scheme="http" /></intent></queries>' "$MANIFEST"
          done

      # Финальная сборка с прокидыванием "y" на случай проверок
      - name: Build APK
        run: echo "y" | flet build apk

      - uses: actions/upload-artifact@v4
        with:
          name: prognoz-apk
          path: build/apk/app-release.apk

